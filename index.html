<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>מאז שיחת הערב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --deep:    #0d0b10;
  --mid:     #1a1520;
  --rose:    #c4837a;
  --rose2:   #e8a89f;
  --gold:    #c9a96e;
  --gold2:   #e8d5a8;
  --muted:   #7a6e7a;
  --soft:    #4a3f4a;
  --white:   #f5f0eb;
  --glow-r:  rgba(196,131,122,0.18);
  --glow-g:  rgba(201,169,110,0.12);
}

html,body{height:100%;background:var(--deep);color:var(--white);font-family:'DM Sans',sans-serif;overflow:hidden}

/* ── CANVAS ── */
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── BG GLOWS ── */
.glow-l{position:fixed;top:-20%;left:-15%;width:60vw;height:70vh;
  background:radial-gradient(ellipse,rgba(196,131,122,0.12) 0%,transparent 65%);
  pointer-events:none;z-index:1;animation:drift 14s ease-in-out infinite alternate}
.glow-r{position:fixed;bottom:-20%;right:-10%;width:50vw;height:60vh;
  background:radial-gradient(ellipse,rgba(201,169,110,0.09) 0%,transparent 65%);
  pointer-events:none;z-index:1;animation:drift 18s ease-in-out infinite alternate-reverse}

/* ── PAGE LAYOUT ── */
.page{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;padding:2rem}

/* ── TOP LABEL ── */
.eyebrow{
  font-family:'DM Sans',sans-serif;font-weight:200;
  font-size:clamp(0.58rem,1.4vw,0.68rem);letter-spacing:0.42em;
  color:var(--muted);text-transform:uppercase;
  margin-bottom:2.5rem;
  opacity:0;animation:fadeUp 1.2s ease forwards 0.4s}

/* ── MAIN NUMBER ── */
.number-wrap{position:relative;text-align:center;margin-bottom:0.2rem;
  opacity:0;animation:zoomIn 1.4s cubic-bezier(0.16,1,0.3,1) forwards 0.7s}

.big-num{
  font-family:'Cormorant Garamond',serif;font-weight:900;
  font-size:clamp(8rem,30vw,18rem);line-height:0.82;
  color:var(--white);letter-spacing:-0.04em;
  position:relative;display:inline-block;
  text-shadow:0 0 80px rgba(196,131,122,0.25),0 0 160px rgba(196,131,122,0.10)}

/* rose underline */
.big-num::after{
  content:'';position:absolute;bottom:6px;left:5%;right:5%;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--rose),transparent);
  transform:scaleX(0);transform-origin:center;
  animation:lineGrow 1s ease forwards 2s}

/* ── UNIT ── */
.unit{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(1.4rem,4vw,2.4rem);color:var(--rose2);letter-spacing:0.1em;
  margin-top:0.3rem;margin-bottom:2rem;
  opacity:0;animation:fadeUp 1s ease forwards 1.2s}

/* ── TIME ROW ── */
.time-row{
  display:flex;align-items:center;gap:1.2rem;margin-bottom:3.5rem;
  opacity:0;animation:fadeUp 1s ease forwards 1.5s}

.time-cell{text-align:center}
.time-val{
  font-family:'Cormorant Garamond',serif;font-weight:400;
  font-size:clamp(1.4rem,3.5vw,2rem);color:var(--gold2);
  letter-spacing:0.04em;font-variant-numeric:tabular-nums;line-height:1}
.time-lbl{
  font-family:'DM Sans',sans-serif;font-weight:200;
  font-size:0.58rem;letter-spacing:0.3em;color:var(--muted);
  text-transform:uppercase;margin-top:0.25rem}
.time-dot{
  font-family:'Cormorant Garamond',serif;font-size:1.8rem;
  color:var(--soft);line-height:1;padding-bottom:0.8rem;align-self:flex-end}

/* ── DATE BADGE ── */
.date-badge{
  display:inline-flex;align-items:center;gap:0.6rem;
  border:1px solid var(--soft);border-radius:100px;
  padding:0.45rem 1.2rem;margin-bottom:3.5rem;
  backdrop-filter:blur(10px);background:rgba(255,255,255,0.03);
  opacity:0;animation:fadeUp 1s ease forwards 1.8s}
.badge-dot{width:5px;height:5px;border-radius:50%;background:var(--rose);
  animation:pulseDot 2.5s ease-in-out infinite;flex-shrink:0}
.badge-text{font-family:'DM Sans',sans-serif;font-weight:300;
  font-size:clamp(0.65rem,1.8vw,0.78rem);color:var(--muted);letter-spacing:0.06em}

/* ── STOP BUTTON ── */
.stop-wrap{opacity:0;animation:fadeUp 1s ease forwards 2.2s}

.stop-btn{
  position:relative;overflow:hidden;
  border:1px solid rgba(196,131,122,0.4);border-radius:100px;
  background:transparent;
  color:var(--rose2);
  font-family:'DM Sans',sans-serif;font-weight:300;
  font-size:clamp(0.65rem,1.8vw,0.75rem);letter-spacing:0.28em;text-transform:uppercase;
  padding:0.85rem 2.8rem;cursor:pointer;
  transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1)}

.stop-btn::before{
  content:'';position:absolute;inset:0;border-radius:100px;
  background:radial-gradient(ellipse at center,rgba(196,131,122,0.15),transparent 70%);
  opacity:0;transition:opacity 0.3s}

.stop-btn:hover{
  transform:scale(1.06);
  border-color:var(--rose);
  color:var(--white);
  box-shadow:0 0 40px rgba(196,131,122,0.25),0 0 80px rgba(196,131,122,0.10)}
.stop-btn:hover::before{opacity:1}
.stop-btn:active{transform:scale(0.97)}

/* ── OVERLAY ── */
.overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--deep);
  opacity:0;pointer-events:none;
  transition:opacity 1.2s ease}
.overlay.show{opacity:1;pointer-events:all}

.overlay-glow{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:80vw;height:80vh;
  background:radial-gradient(ellipse,rgba(196,131,122,0.16) 0%,transparent 60%);
  pointer-events:none}

.ov-inner{
  position:relative;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:0}

.ov-eye{
  font-family:'DM Sans',sans-serif;font-weight:200;
  font-size:0.65rem;letter-spacing:0.4em;color:var(--muted);
  text-transform:uppercase;margin-bottom:1.2rem}

.ov-phrase{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(1rem,3vw,1.6rem);color:var(--muted);
  line-height:1.5;margin-bottom:0.8rem}

.ov-num{
  font-family:'Cormorant Garamond',serif;font-weight:900;
  font-size:clamp(7rem,28vw,16rem);line-height:0.82;
  color:var(--rose2);letter-spacing:-0.04em;
  text-shadow:0 0 100px rgba(196,131,122,0.3)}

.ov-unit{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(1.2rem,3.5vw,2rem);color:var(--rose);
  letter-spacing:0.1em;margin-bottom:0.6rem}

.ov-sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(0.9rem,2.5vw,1.3rem);color:var(--muted);margin-bottom:3rem}

.restart-btn{
  border:1px solid var(--soft);border-radius:100px;
  background:transparent;color:var(--muted);
  font-family:'DM Sans',sans-serif;font-weight:300;
  font-size:0.65rem;letter-spacing:0.28em;text-transform:uppercase;
  padding:0.7rem 2rem;cursor:pointer;
  transition:all 0.3s ease}
.restart-btn:hover{border-color:var(--muted);color:var(--white);transform:translateY(-2px)}

/* ── KEYFRAMES ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}}
@keyframes zoomIn{
  from{opacity:0;transform:scale(0.88) translateY(20px)}
  to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes lineGrow{to{transform:scaleX(1)}}
@keyframes drift{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(3%,4%) scale(1.08)}}
@keyframes pulseDot{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.25;transform:scale(0.5)}}

/* number flash on change */
.flash{animation:numFlash .15s ease}
@keyframes numFlash{
  0%{color:var(--rose2)}
  100%{color:var(--white)}}

@media(max-height:620px){
  .big-num{font-size:5rem}
  .unit{margin-bottom:1rem}
  .time-row{margin-bottom:2rem}
  .date-badge{margin-bottom:2rem}
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="glow-l"></div>
<div class="glow-r"></div>

<!-- MAIN PAGE -->
<div class="page">
  <div class="eyebrow">מאז שיחת הערב האחרונה</div>

  <div class="number-wrap">
    <div class="big-num" id="daysNum">10</div>
  </div>
  <div class="unit">ימים</div>

  <div class="time-row">
    <div class="time-cell">
      <div class="time-val" id="hh">00</div>
      <div class="time-lbl">שעות</div>
    </div>
    <div class="time-dot">·</div>
    <div class="time-cell">
      <div class="time-val" id="mm">00</div>
      <div class="time-lbl">דקות</div>
    </div>
    <div class="time-dot">·</div>
    <div class="time-cell">
      <div class="time-val" id="ss">00</div>
      <div class="time-lbl">שניות</div>
    </div>
  </div>

  <div class="date-badge">
    <span class="badge-dot" id="dot"></span>
    <span class="badge-text">חמישי · 14 למאי 2026 · 21:18</span>
  </div>

  <div class="stop-wrap">
    <button class="stop-btn" onclick="doStop()">עצור ספירה</button>
  </div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="overlay-glow"></div>
  <div class="ov-inner">
    <div class="ov-eye">הספירה עצרה</div>
    <div class="ov-phrase">שיחת הערב חזרה אחרי</div>
    <div class="ov-num" id="finalNum">10</div>
    <div class="ov-unit">ימים</div>
    <div class="ov-sub">של ציפייה וגעגוע</div>
    <button class="restart-btn" onclick="doRestart()">התחל ספירה מחדש</button>
  </div>
</div>

<script>
/* ── PARTICLES ── */
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W,H,pts=[];

function resize(){
  W=cv.width=window.innerWidth;
  H=cv.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

function mkPt(){
  return{
    x:Math.random()*W,y:Math.random()*H,
    r:Math.random()*1.2+0.3,
    dx:(Math.random()-.5)*.15,
    dy:-(Math.random()*.25+.05),
    a:Math.random(),
    da:Math.random()*.003+.001,
    color:Math.random()>.5
      ?`rgba(196,131,122,`
      :`rgba(201,169,110,`
  };
}

for(let i=0;i<90;i++) pts.push(mkPt());

function drawPts(){
  cx.clearRect(0,0,W,H);
  pts.forEach(p=>{
    p.x+=p.dx; p.y+=p.dy; p.a+=p.da;
    if(p.a>1||p.a<0) p.da*=-1;
    if(p.y<-10) Object.assign(p,mkPt(),{y:H+10});
    cx.beginPath();
    cx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cx.fillStyle=p.color+p.a+')';
    cx.fill();
  });
  requestAnimationFrame(drawPts);
}
drawPts();

/* ── COUNTER ── */
const START=new Date('2026-05-14T21:18:00');
let prevD=-1,stopped=false;

function pad(n){return String(n).padStart(2,'0');}

function tick(){
  if(stopped) return;
  const now=new Date();
  const diff=Math.max(0,now-START);
  const d=Math.floor(diff/86400000);
  const h=Math.floor((diff%86400000)/3600000);
  const m=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);

  if(d!==prevD){
    const el=document.getElementById('daysNum');
    el.textContent=d;
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
    prevD=d;
  }
  document.getElementById('hh').textContent=pad(h);
  document.getElementById('mm').textContent=pad(m);
  document.getElementById('ss').textContent=pad(s);
}

tick();
const iv=setInterval(tick,1000);

/* ── STOP ── */
function doStop(){
  stopped=true;
  clearInterval(iv);
  document.getElementById('finalNum').textContent=
    document.getElementById('daysNum').textContent;
  document.getElementById('dot').style.animation='none';
  document.getElementById('dot').style.background='#4a3f4a';
  document.getElementById('overlay').classList.add('show');
}

function doRestart(){
  stopped=false;
  document.getElementById('dot').style.animation='';
  document.getElementById('dot').style.background='';
  document.getElementById('overlay').classList.remove('show');
  prevD=-1;
  tick();
  setInterval(tick,1000);
}
</script>
</body>
</html>
